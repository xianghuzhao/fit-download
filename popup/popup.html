<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        color: #333;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
      }
      .workout-id {
        margin-bottom: 12px;
        color: #666;
      }
      .status {
        margin-bottom: 12px;
        font-size: 12px;
        color: #999;
      }
      button {
        width: 100%;
        padding: 8px 16px;
        background: #4285f4;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      button:hover:not(:disabled) {
        background: #3367d6;
      }
    </style>
  </head>
  <body>
    <h1>Xingzhe FIT Downloader</h1>
    <div class="workout-id" id="workoutId">Workout: —</div>
    <div class="status" id="status"></div>
    <button id="downloadBtn" disabled>Download FIT</button>
    <script src="../content/fit_converter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
